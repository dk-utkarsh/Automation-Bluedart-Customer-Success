# nginx front for the Zoho Mail outgoing webhook.
#
#   sudo cp nginx-zoho-webhook.conf /etc/nginx/sites-available/zoho-webhook
#   sudo ln -s /etc/nginx/sites-available/zoho-webhook /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d cs.dentalkart.com     # fills in the TLS lines
#   sudo nginx -t && sudo systemctl reload nginx
#
# REPLACE cs.dentalkart.com with a real name that resolves to 209.38.120.154.
# A bare IP will not work: Let's Encrypt does not issue certificates for IP
# addresses, and the webhook needs a URL Zoho can validate over HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name cs.dentalkart.com;

    # certbot writes its challenge here, everything else goes to TLS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cs.dentalkart.com;

    # certbot --nginx fills these in.
    # ssl_certificate     /etc/letsencrypt/live/cs.dentalkart.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/cs.dentalkart.com/privkey.pem;

    # The box holds customer PII in output/ and credentials in .env. Nothing but the
    # hook path and a health check is reachable, so opening 443 does not expose the
    # rest of the machine.
    location = /zoho-mail-hook {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The receiver answers immediately and scans in the background, so these are
        # generous only to survive a slow moment - never a whole IMAP round trip.
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        client_max_body_size 1m;      # Zoho payloads are a few KB
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
    }

    location / { return 404; }
}
